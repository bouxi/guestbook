
services:
  php:
    image: php:8.3-cli
    working_dir: /app
    volumes:
      - .:/app
    command: php -S 0.0.0.0:8000 -t public
    ports:
      - "8000:8000"
###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "5432"
###< doctrine/doctrine-bundle ###

###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###
